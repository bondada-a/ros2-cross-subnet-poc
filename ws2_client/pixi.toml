# pixi.toml -- ws2_client container
#
# Adapted from https://github.com/jennmald/cms-ros-client (the environment
# currently deployed on the real ws2 workstation). Kept as close to upstream
# as possible so the sandbox demonstrably tests the same software stack.
#
# Deviations from upstream (annotated inline):
#   * Added ros-humble-rmw-fastrtps-cpp to force Fast DDS as the active RMW
#     -- upstream relies on whatever ships with ros-humble-rclpy (which is
#     Fast DDS today, but being explicit eliminates ambiguity).
#   * Added ros-humble-geometry-msgs etc. are already present.
#   * No changes to the `profile` feature -- we keep the full Bluesky /
#     Tiled / databroker scientific stack for realism.

[workspace]
authors = ["Max Rakitin <mrakitin@bnl.gov>, Jennefer Maldonado <jmaldonad@bnl.gov>, Aditya Bondada <abondada@bnl.gov>"]
channels = ["conda-forge", "robostack-staging"]
name = "rclpy"
# Upstream declares osx-arm64 too; we drop it because this sandbox is
# linux-only. Keeping only linux-64 skips per-platform conda solves for
# a platform we would never materialize.
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
topic-list = "ros2 topic list"
node-list = "ros2 node list"
action-list = "ros2 action list"

[feature.ros.dependencies]
ipython = ">=9.9.0,<10"
ros-humble-rclpy = ">=3.3.16,<4"
ros-humble-ros2cli = ">=0.18.12,<0.19"
ros-humble-ros2topic = ">=0.18.12,<0.19"
ros-humble-ros2action = ">=0.18.12,<0.19"
ros-humble-ros2node = ">=0.18.12,<0.19"
ros-humble-turtlesim = ">=1.4.2,<2"
ros-humble-rosidl-default-generators = ">=1.2.0,<2"
ros-humble-rosidl-default-runtime = ">=1.2.0,<2"
ros-humble-rosidl-generator-py = ">=0.14.4,<0.15"
ros-humble-rosidl-generator-c = ">=3.1.6,<4"
ros-humble-ament-cmake-python = ">=1.3.12,<2"
ros-humble-geometry-msgs = ">=4.9.0,<5"
ros-humble-std-msgs = ">=4.9.0,<5"
colcon-common-extensions = ">=0.3.0,<0.4"
# Deviation vs upstream: force Fast DDS explicitly. ros-humble-rclpy pulls
# an RMW transitively, but being explicit lets us assert in our IT doc
# "the ws2 env uses rmw_fastrtps_cpp" without caveats. No version pin
# because RoboStack's RMW package moves faster than we can pin to; the
# solver picks a compatible version that matches rclpy.
ros-humble-rmw-fastrtps-cpp = "*"

[feature.profile.dependencies]
bluesky-base = "==1.14.6"
matplotlib-base= ">=3.9.3,<4"
networkx = ">=3.4.2,<4"
nslsii = "==0.11.4"
numpy = "*"
ophyd = ">=1.11.0"
pyepics = "*"
python = "*"
semver = ">=3.0.4,<4"
tiled-client = ">=0.1.6"
lmfit = ">=1.3.4,<2"
paramiko = ">=4.0.0,<5"
peakutils = ">=1.3.5,<2"
suitcase-utils = ">=0.5.4,<0.6"
arvpyf = ">=0.4.3,<0.5"
telnetlib3 = ">=1.0.4,<2"
hdf5-external-filter-plugins = ">=0.1.0,<0.2"
databroker = "==2.0.0"
bluesky-tiled-plugins = ">=2.0.0b68"

[feature.profile.pypi-dependencies]
pvxslibs = ">=1.3.2, <2"

[environments]
ros2 = {features=["profile", "ros"], solve-group="profile"}
